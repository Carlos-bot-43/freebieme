name: FreebieMe Daily Deal Update

on:
  schedule:
    - cron: '0 9 * * *'   # 4 AM ET = 9 AM UTC daily
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Step 1: Content-aware deal verification
      - name: Verify deals (content check)
        run: node verify-deals.js
        continue-on-error: true   # Never fail the whole job over a single chain

      # Step 2: Coupon aggregator (scrapes RetailMeNot, Slickdeals RSS, Reddit r/freebies)
      - name: Run coupon aggregator
        run: node scraper/sources/coupon-aggregator.js
        continue-on-error: true   # Never fail pipeline over coupon scraping issues

      # Step 3: Inject missing deal templates
      - name: Inject missing deal templates
        run: node inject-missing-deals.js

      # Step 3: Generate public deal files (with self-healing guard)
      - name: Generate public deal files
        run: node truncate-for-public.js

      # Step 4: Apply food tags
      - name: Apply food tags
        run: node apply-tags.js

      # Step 5: Apply claim data
      - name: Apply claim data
        run: node apply-claim-data.js

      # Step 6: Generate daily status report
      - name: Generate deal status report
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TOTAL=$(find frontend/public/data/deals -name '*.json' -exec node -e "
            const f=require('fs');let t=0;
            process.argv.slice(1).forEach(p=>{try{t+=(JSON.parse(f.readFileSync(p)).deals||[]).length}catch(e){}});
            process.stdout.write(t.toString());
          " {} + 2>/dev/null || echo "0")

          CHAINS_VERIFIED=$(node -e "
            const f=require('fs'),p='data/output/deal-verification-${DATE}.json';
            try{const r=JSON.parse(f.readFileSync(p));
              const ok=Object.values(r.chains).filter(c=>c.verified_deals.length>0&&!c.error).length;
              process.stdout.write(ok.toString());
            }catch(e){process.stdout.write('N/A');}
          " 2>/dev/null || echo "N/A")

          WARNINGS=$(node -e "
            const f=require('fs'),p='data/output/deal-verification-${DATE}.json';
            try{const r=JSON.parse(f.readFileSync(p));
              const ws=Object.entries(r.chains).filter(([,c])=>c.warning).map(([s,c])=>s+': '+c.warning);
              process.stdout.write(ws.length>0?ws.join('\n'):'None');
            }catch(e){process.stdout.write('Verification file not found');}
          " 2>/dev/null || echo "N/A")

          cat > data/deal-status.md << EOF
          # FreebieMe Deal Status

          **Date:** ${DATE}
          **Run at:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Pipeline Results

          | Step | Status |
          |------|--------|
          | Deal verification | ✓ |
          | Template injection | ✓ |
          | Public file generation | ✓ |
          | Food tags | ✓ |
          | Claim data | ✓ |

          ## Deal Counts

          - **Total deals in public files:** ${TOTAL}
          - **Chains verified:** ${CHAINS_VERIFIED}/34

          ## Verification Warnings

          ${WARNINGS}

          ---
          *Generated by FreebieMe Daily Deal Update workflow*
          EOF

          echo "Status report generated."
          cat data/deal-status.md

      # Step 7: Commit everything
      - name: Commit deal files and status report
        run: |
          git config --local user.email "tjb4123@agentmail.to"
          git config --local user.name "Carlos"

          # Stage public deal files, status report, and verification report
          git add frontend/public/data/deals/
          git add data/deal-status.md
          git add data/last-good-run.json 2>/dev/null || true
          git add data/deal-changelog.json 2>/dev/null || true
          git add "data/output/deal-verification-$(date -u +%Y-%m-%d).json" 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TOTAL=$(node -e "
              const f=require('fs');
              try{console.log(JSON.parse(f.readFileSync('data/last-good-run.json')).total_deals||'?')}
              catch(e){console.log('?')}
            " 2>/dev/null || echo "?")
            git commit -m "Daily deal update $(date -u +%Y-%m-%d) — ${TOTAL} deals"
            git push --force-with-lease
          fi

      - name: Upload verification report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deal-verification-${{ github.run_id }}
          path: data/output/deal-verification-*.json
          retention-days: 7
