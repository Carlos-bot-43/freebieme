name: FreebieMe Daily Deal Update

on:
  schedule:
    - cron: '0 9 * * *'   # 4 AM ET = 9 AM UTC daily
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write    # needed to push deal updates back to main
      issues: write      # needed for alert-broken-chains.js to create GitHub Issues

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Step 1: Content-aware deal verification
      - name: Verify deals (content check)
        run: node verify-deals.js
        continue-on-error: true   # Never fail the whole job over a single chain

      # Step 2: Coupon aggregator (scrapes RetailMeNot, Slickdeals RSS, Reddit r/freebies)
      - name: Run coupon aggregator
        run: node scraper/sources/coupon-aggregator.js
        continue-on-error: true   # Never fail pipeline over coupon scraping issues

      # Step 2b: Seed working deal files from committed frontend data
      # data/output/deals/ is gitignored — populate it from committed frontend files
      # so inject-missing-deals.js and truncate-for-public.js have data to work with
      - name: Seed working deal files
        run: |
          mkdir -p data/output/deals
          cp frontend/public/data/deals/*.json data/output/deals/ 2>/dev/null || true
          echo "Seeded $(ls data/output/deals/*.json 2>/dev/null | wc -l | tr -d ' ') city deal files"

      # Step 3: Inject missing deal templates
      - name: Inject missing deal templates
        run: node inject-missing-deals.js

      # Step 3: Generate public deal files (with self-healing guard)
      - name: Generate public deal files
        run: node truncate-for-public.js

      # Step 4: Apply food tags
      - name: Apply food tags
        run: node apply-tags.js

      # Step 5: Apply claim data
      - name: Apply claim data
        run: node apply-claim-data.js

      # Step 5b: Build the normalized DB + slim public DB from the freshly-generated
      # per-city JSON. Source-of-truth shifts to data/normalized/db.json; the slim
      # public DB at frontend/public/data/db.json (~220 KB) feeds the new chain pages
      # and /api/deals. Per-city files stay for backward compat with /deals/[city].
      - name: Build normalized DB
        run: npm run build:normalized

      - name: Publish slim DB + index
        run: npm run build:public

      # Step 6: Generate daily status report (Node script — avoids heredoc fragility)
      - name: Generate deal status report
        run: node generate-status-report.js

      # Step 6b: Alert on broken chain URLs (GitHub Issues — only for true 404s)
      - name: Create GitHub Issue for broken chain URLs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node alert-broken-chains.js

      # Step 7: Commit everything
      - name: Commit deal files and status report
        run: |
          git config --local user.email "tjb4123@agentmail.to"
          git config --local user.name "Carlos"

          # Stage public deal files, normalized DB, status report, and verification report
          git add frontend/public/data/deals/
          git add frontend/public/data/db.json 2>/dev/null || true
          git add frontend/public/data/index.json 2>/dev/null || true
          git add data/normalized/db.json 2>/dev/null || true
          git add data/deal-status.md
          git add data/last-good-run.json 2>/dev/null || true
          git add data/deal-changelog.json 2>/dev/null || true
          git add "data/output/deal-verification-$(date -u +%Y-%m-%d).json" 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TOTAL=$(node -e "
              const f=require('fs');
              try{console.log(JSON.parse(f.readFileSync('data/last-good-run.json')).total_deals||'?')}
              catch(e){console.log('?')}
            " 2>/dev/null || echo "?")
            git commit -m "Daily deal update $(date -u +%Y-%m-%d) — ${TOTAL} deals"
            git push --force-with-lease
          fi

      - name: Upload verification report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deal-verification-${{ github.run_id }}
          path: data/output/deal-verification-*.json
          retention-days: 7
