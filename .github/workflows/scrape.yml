name: FreebieMe Daily Scraper

on:
  schedule:
    - cron: '0 9 * * *'   # 4 AM ET = 9 AM UTC daily
  workflow_dispatch:
    inputs:
      refresh_locations:
        description: 'Force refresh OSM locations'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install scraper dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.refresh_locations }}" = "true" ]; then
            ARGS="--refresh-locations"
          fi
          node scraper/index.js $ARGS
        env:
          NODE_ENV: production

      - name: Generate truncated public deal files
        # Converts data/output/deals/ → frontend/public/data/deals/
        # Only these 17MB of truncated files go into git — NOT the 241MB data/output/
        run: node truncate-for-public.js

      - name: Commit and push public deal files
        run: |
          git config --local user.email "scraper@freebieme.com"
          git config --local user.name "FreebieMe Bot"

          # Only commit the public-facing truncated files, never data/output/
          git add frontend/public/data/deals/

          if git diff --staged --quiet; then
            echo "No deal changes to commit"
          else
            git commit -m "Daily deal update $(date -u +%Y-%m-%d)"
            git push --force-with-lease
          fi

      - name: Upload scrape logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_id }}
          path: data/output/meta.json
          retention-days: 7
